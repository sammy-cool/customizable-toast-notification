<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Toast CTA Test</title>
  </head>
  <body>
    <h1>Toast CTA Examples</h1>

    <button onclick="testBasicCTA()">Basic Button CTA</button>
    <button onclick="testLinkCTA()">Link CTA</button>
    <button onclick="testNonClosingCTA()">Non-Closing CTA</button>
    <button onclick="testAsyncCTA()">Async CTA</button>
    <button onclick="testGroupedCTA()">Test Grouping with CTA</button>
    <button onclick="testPauseCTA()">Test Pause with CTA</button>
    <button onclick="closeNoop()">Test Pause with CTA</button>

    <script type="module">
      import {
        createToast,
        setDefaultColors,
        setDefaultMessages,
        noop,
      } from "../../src/index.js";

      window.testBasicCTA = () => {
        setDefaultColors({
          info: "teal",
          success: "orange",
          error: "red",
          warning: "rebeccapurple ",
        });
        setDefaultMessages({
          info: "This is an informational message!",
          success: "Your action was successful!",
          error: "An error has occurred!",
          warning: "This is a warning message!",
        });
        createToast();
        createToast({
          message: "This is a success toast notification!",
          duration: 500000,
          animationDuration: "1.5s",
          animationEasing: "ease-in-out",
          position: "top-full-width",
          // type: "warning", // info, success, error, or warning
          // backgroundColor: 'green', // Custom background color
          // textColor: "orange", // Custom text color
          showCloseButton: true,
          cta: {
            autoClose: false, //toast close nhi hota by default close hoga instant nhi true case instant all toast closes
            label: "Download",
            href: "https://cdn.jsdelivr.net/npm/customizable-toast-notification",
            variant: "link",
            target: "_blank",
          },
        });
      };

      window.testLinkCTA = () => {
        createToast({
          message: "Update available",
          type: "info",
          cta: {
            label: "Learn More",
            href: "https://cdn.jsdelivr.net/npm/customizable-toast-notification",
            variant: "link",
            target: "_blank",
          },
        });
      };

      window.testNonClosingCTA = () => {
        createToast({
          message: "Confirm this action?",
          type: "warning",
          duration: 0,
          cta: {
            label: "Confirm",
            autoClose: false,
            onClick: () => console.log("Action confirmed!"),
          },
        });
      };

      window.testAsyncCTA = () => {
        createToast({
          message: "Ready to backup?",
          cta: {
            label: "Start Backup",
            onClick: async () => {
              console.log("Backup starting...");
              await new Promise((r) => setTimeout(r, 3000));
              console.log("Backup done!");
            },
          },
        });
      };

      window.testGroupedCTA = () => {
        // Rapid fire same message - should group with badge
        for (let i = 0; i < 5; i++) {
          createToast({
            message: "File uploaded",
            cta: {
              label: "View",
              onClick: () => console.log(`View file ${i + 1}`),
            },
          });
        }
      };

      // Automatically pauses on hover because it has a CTA
      window.testPauseCTA = () => {
        createToast({
          message: "File uploaded successfully!",
          cta: {
            label: "View File",
            onClick: () => window.open("/dist/"),
          },
          pauseOnHover: false,
        });

        createToast({
          message: "Ready to sync your data?",
          duration: 500000,
          cta: {
            label: "Sync Now",
            ariaLabel: "Start data synchronization",
            autoClose: false,
            onClick: async () => {
              // Manually close if needed
            },
          },
        });
      };
      window.closeNoop = () => {
        noop();
      };
    </script>
  </body>
</html>
