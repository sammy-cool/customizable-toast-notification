    <script type="module">
      import {
        createToast,
        setDefaultColors,
        setDefaultMessages,
      } from "../src/index.js";

      // Optional: Set default colors and messages
      setDefaultColors({
        info: "#3498db",
        success: "#2ecc71",
        error: "#e74c3c",
        warning: "#f39c12",
      });

      setDefaultMessages({
        info: "Updated info message!",
        success: "Updated success message!",
        error: "Updated error message!",
        warning: "Updated warning message!",
      });

      window.createToasty = function () {
        createToast({
          animationEasing: "ease-in-out",
          animationDuration: "1s",
          message: "This is a toast with a close button.",
          duration: 5000,
          position: "bottom-right",
          type: "info",
          showCloseButton: true,
          backgroundColor: "#111", // Custom background color
          textColor: "white", // Custom text color
          showProgressBar: true,
          progressColor: "yellow",
          progressHeight: "3px",
          progressPosition: "top",
        });
        createToast();
        createToast({ position: "bottom-left" });
      };

      console.log("Initial document.readyState:", document.readyState);

      // Heavy function simulation
      function heavyLoad(ms) {
        const start = performance.now();
        while (performance.now() - start < ms) {
          // busy-wait loop to block the main thread
          // simulates heavy computation / blocking script
        }
      }

      // Simulate heavy load for 5 seconds
      console.log("Starting heavy load...");
      heavyLoad(5000);
      console.log("Finished heavy load");
      console.log("document.readyState after heavy load:", document.readyState);

      // Observe DOM ready
      document.addEventListener("DOMContentLoaded", () => {
        console.log("DOMContentLoaded fired! ReadyState:", document.readyState);
      });

      window.addEventListener("load", () => {
        console.log("window load fired! ReadyState:", document.readyState);
      });
