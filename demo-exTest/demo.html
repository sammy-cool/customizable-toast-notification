<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customizable Toast Notification - Demo</title>

    <!-- Load your library from jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/customizable-toast-notification/dist/index.umd.js"></script>

    <style>
      body {
        font-family: system-ui, sans-serif;
        background: var(--page-bg, #f5f5f5);
        color: var(--page-text, #222);
        padding: 2rem;
        transition: background 0.3s, color 0.3s;
      }

      h1 {
        margin-bottom: 1rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }

      button {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: transform 0.2s;
      }
      button:hover {
        transform: scale(1.05);
      }

      /* Theme buttons */
      .success {
        background: #28a745;
        color: #fff;
      }
      .error {
        background: #dc3545;
        color: #fff;
      }
      .warning {
        background: #ffc107;
        color: #000;
      }
      .info {
        background: #17a2b8;
        color: #fff;
      }

      .theme-toggle {
        background: #333;
        color: #fff;
      }

      /* Dark mode */
      .dark {
        --page-bg: #111;
        --page-text: #eee;
      }
    </style>
  </head>
  <body>
    <h1>🍞 Customizable Toast Notification - Demo</h1>
    <p>Click the buttons below to test different toast styles:</p>

    <div class="controls">
      <button class="success" onclick="showToast('success')">
        Success Toast
      </button>
      <button class="error" onclick="showToast('error')">Error Toast</button>
      <button class="warning" onclick="showToast('warning')">
        Warning Toast
      </button>
      <button class="info" onclick="showToast('info')">Info Toast</button>
      <button class="theme-toggle" onclick="toggleTheme()">
        Toggle Dark Mode
      </button>
    </div>

    <script>
      function showToast(type) {
        customizableToast.createToast({
          message: `This is a ${type} toast!`,
          type,
          position: "top-right",
          duration: 3000,
          className: type + "-demo",
        });
      }

      function toggleTheme() {
        document.body.classList.toggle("dark");
      }
    </script>
  </body>
</html>
