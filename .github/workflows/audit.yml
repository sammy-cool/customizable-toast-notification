name: Weekly Security Audit

on:
  schedule:
    - cron: '17 3 * * 0' # Sundays at 3:17 AM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🔒 Security Audit Failed — ${new Date().toISOString().split('T')[0]}`;
            const body = `The weekly \`npm audit --omit=dev\` check found production vulnerabilities.\n\nPlease run \`npm audit --omit=dev\` locally for details and apply fixes.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'automated']
            });
