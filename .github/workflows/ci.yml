name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    # AUDIT/CI FIX: pinning the exact official Playwright Docker image
    # instead of installing browsers onto whatever base ubuntu-latest
    # happens to be this week. This is the single biggest lever for the
    # cross-environment flakiness we've been chasing (webkit passing
    # locally, failing in CI, etc.) — the image ships the EXACT browser
    # builds + system libraries Playwright's own team tested against,
    # instead of "ubuntu-latest + apt install whatever --with-deps grabs
    # today". Running the whole job inside the container (not just a
    # docker step) means every later step — build, tests, everything —
    # runs in that same known-good environment.
    #
    # IMPORTANT: the version tag (v1.63.0) MUST match the @playwright/test
    # version actually resolved in your package-lock.json. Microsoft's own
    # docs are explicit about this: a mismatched image/package version
    # means Playwright can't find the browser executables it expects.
    # Check with `npm ls @playwright/test` and update this tag any time
    # you bump the package. The "-noble" suffix targets Ubuntu 24.04 —
    # match this to whatever your package.json currently specifies.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Audit Production Security
        run: npm audit --omit=dev

      - name: Build Package
        run: npm run zone-build

      - name: Test Build Artifacts
        run: npm run test:builds

      - name: Run Unit Tests & Coverage
        run: npm run test:coverage

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Run Playwright Tests
        env:
          HOME: /root
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

  sonarcloud:
    name: SonarQube Cloud SAST & Quality Gate
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Test Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SonarQube Scanner Metadata Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-scan-metadata
          path: .scannerwork/report-task.txt
          retention-days: 14
          if-no-files-found: ignore

