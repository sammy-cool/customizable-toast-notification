# SonarQube Cloud Project Configuration
sonar.organization=Priyanshu Patel
sonar.projectKey=sammy-cool
# Source and Test directories
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclude compiled distribution, dependencies, and documentation assets from SAST metrics
sonar.exclusions=dist/**,node_modules/**,docs/**,coverage/**,playwright-report/**,test-results/**,*.config.*,scripts/**

# Path to LCOV test coverage report generated by c8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Runtime environments
sonar.javascript.environments=browser,node
